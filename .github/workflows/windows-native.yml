name: Build native Mega Drive Solo for Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            label: 32bit
            core: https://buildbot.libretro.com/nightly/windows/x86/latest/genesis_plus_gx_libretro.dll.zip
          - rid: win-x64
            label: 64bit
            core: https://buildbot.libretro.com/nightly/windows/x86_64/latest/genesis_plus_gx_libretro.dll.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download Genesis Plus GX for this architecture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'mdcore'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $zip=Join-Path $tmp 'core.zip'
          Invoke-WebRequest '${{ matrix.core }}' -OutFile $zip
          Expand-Archive $zip (Join-Path $tmp 'extracted') -Force
          $dll=Get-ChildItem (Join-Path $tmp 'extracted') -Filter genesis_plus_gx_libretro.dll -Recurse | Select-Object -First 1
          if(-not $dll){throw 'Genesis Plus GX DLL was not found.'}
          $out=Join-Path $env:RUNNER_TEMP 'core'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName (Join-Path $out 'genesis_plus_gx_libretro.dll') -Force
          "CORE_PATH=$out\genesis_plus_gx_libretro.dll" | Out-File $env:GITHUB_ENV -Append
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'Inno Setup install failed'}
      - name: Publish single-file native Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'publish'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish windows/MegaDriveSolo.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:CorePath=$env:CORE_PATH -o $out
          if($LASTEXITCODE -ne 0){throw 'dotnet publish failed'}
          $exe=Get-ChildItem $out -Filter MegaDriveSolo.exe | Select-Object -First 1
          if(-not $exe){throw 'MegaDriveSolo.exe missing after publish'}
          $builtExe=Get-ChildItem $out -Filter MegaDriveSolo.exe | Select-Object -First 1
          if(-not $builtExe){throw 'MegaDriveSolo.exe missing'}
          $exeName='MegaDriveSolo-Windows-${{ matrix.label }}.exe'
          $exe=Join-Path $env:RUNNER_TEMP $exeName
          Copy-Item $builtExe.FullName $exe -Force
          if((Get-Item $env:CORE_PATH).Length -lt 100KB){throw 'embedded core DLL too small'}
          $rid='${{ matrix.rid }}'
          $expected=if($rid -eq 'win-x64'){0x8664}else{0x014c}
          $stream=[IO.File]::OpenRead($exe); $reader=[IO.BinaryReader]::new($stream); $stream.Position=0x3c; $pe=$reader.ReadInt32(); $stream.Position=$pe+4; $machine=$reader.ReadUInt16(); $stream.Dispose()
          if($machine -ne $expected){throw "Wrong EXE architecture: $machine"}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){throw 'Inno Setup Compiler missing'}
          $setupScript=Join-Path $env:RUNNER_TEMP 'MegaDriveSoloSetup.iss'
          $defaultDir=if($rid -eq 'win-x64'){'{autopf}\Mega Drive Solo'}else{'{autopf32}\Mega Drive Solo'}
          $archMode=if($rid -eq 'win-x64'){'ArchitecturesInstallIn64BitMode=x64'}else{''}
          $archAllowed=if($rid -eq 'win-x64'){'x64'}else{'x86'}
          $appId=if($rid -eq 'win-x64'){'{{9E77B9EA-0F5E-4B12-A01A-55AA12F20064}}'}else{'{{9E77B9EA-0F5E-4B12-A01A-55AA12F20032}}'}
          $iss=@"
          [Setup]
          AppId=$appId
          AppName=Mega Drive Solo
          AppVersion=2.2.0
          AppPublisher=Raully Gomes Barbosa
          DefaultDirName=$defaultDir
          DefaultGroupName=Mega Drive Solo
          OutputDir=$env:RUNNER_TEMP
          OutputBaseFilename=MegaDriveSolo-Windows-${{ matrix.label }}-Setup
          $archMode
          ArchitecturesAllowed=$archAllowed
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          Uninstallable=yes
          PrivilegesRequired=lowest
          
          [Files]
          Source: "$exe"; DestDir: "{app}"; Flags: ignoreversion
          
          [Icons]
          Name: "{group}\Mega Drive Solo"; Filename: "{app}\$exeName"; WorkingDir: "{app}"
          Name: "{autodesktop}\Mega Drive Solo"; Filename: "{app}\$exeName"; WorkingDir: "{app}"; Tasks: desktopicon
          
          [Tasks]
          Name: "desktopicon"; Description: "Criar atalho na area de trabalho"; GroupDescription: "Atalhos:"
          
          [Run]
          Filename: "{app}\$exeName"; Description: "Abrir Mega Drive Solo"; Flags: postinstall nowait skipifsilent
          "@
          Set-Content $setupScript $iss -Encoding UTF8
          & $iscc $setupScript
          if($LASTEXITCODE -ne 0){throw 'Inno Setup compilation failed'}
          $setup=Join-Path $env:RUNNER_TEMP "MegaDriveSolo-Windows-${{ matrix.label }}-Setup.exe"
          if(-not (Test-Path $setup) -or (Get-Item $setup).Length -lt 50MB){throw 'Setup EXE was not created or is incomplete'}
          "SETUP_PATH=$setup" | Out-File $env:GITHUB_ENV -Append
      - name: Upload standalone setup installer
        uses: actions/upload-artifact@v4
        with:
          name: MegaDriveSolo-Windows-${{ matrix.label }}-Setup
          path: ${{ runner.temp }}/MegaDriveSolo-Windows-${{ matrix.label }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download both standalone Windows executables
        uses: actions/download-artifact@v4
        with:
          pattern: MegaDriveSolo-Windows-*-Setup
          path: dist
          merge-multiple: true
      - name: Publish x86 and x64 Setup installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='windows-setup-native-v1.0.1'
          gh release create $tag dist/MegaDriveSolo-Windows-32bit-Setup.exe dist/MegaDriveSolo-Windows-64bit-Setup.exe --title 'Mega Drive Solo Setup para Windows v1.0.1' --notes 'Instaladores Setup nativos do Mega Drive Solo em executáveis .exe diretos, x86 32 bits e x64 64 bits. Baixe e execute o setup da arquitetura correspondente; sem ZIP e sem RetroArch. ROMs e BIOS não incluídas.'
