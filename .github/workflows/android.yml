name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build native Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MegaDriveSolo-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish native APK to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.0
          name: Mega Drive Solo v1.10.0
          prerelease: true
          body: 'Corrige o controle da alavanca virtual: direções do D-pad são enviadas como pressionamentos digitais mantidos para navegar pela grade de personagens; mantém joystick circular e botões A/B/C/X/Y/Z.'
          files: app/build/outputs/apk/debug/app-debug.apk
