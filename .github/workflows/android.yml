name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build native Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MegaDriveSolo-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish native APK to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: Mega Drive Solo v0.4.0 (nativo)
          prerelease: true
          body: 'APK Android nativo sem WebView. Suporte a ROMs .bin/.gen/.md/.smd e extração de ZIP/7z com Genesis Plus GX ARM64. ROMs não incluídas; teste em aparelho real ainda necessário.'
          files: app/build/outputs/apk/debug/app-debug.apk
